variables:
  BuildCacheKey: Tgs.SerialNumber.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true

unit-test:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - build-code
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  artifacts:
    when: always
    reports:
      junit: ./TestReports/*-TestReport.xml


push-nuget:
  stage: publish
  needs:
    - test
  cache:
    key: $BuildCacheKey
    untracked: true   
    policy: pull
  only:
    - main
  script:
    - dotnet pack -c $BuildConfiguration "Tgs.SerialNumberGenerator/Tgs.SerialNumberGenerator.csproj" --no-build --no-restore
    - dotnet nuget push "Tgs.SerialNumberGenerator/bin/$BuildConfiguration/*.nupkg" --source "raypro-baget" -k $NugetApiKey --skip-duplicate
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
    paths:
      - Tgs.SerialNumberGenerator/bin/$BuildConfiguration/*.nupkg
