include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  BuildCacheKey: Tgs.SerialNumber.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package 'Tgs.SerialNumberGenerator'
  artifacts:
    paths:
      - Tgs.SerialNumberGenerator/bin/$BuildConfiguration/*.nupkg
